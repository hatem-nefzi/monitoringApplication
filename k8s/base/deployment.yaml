apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-backend
  labels:
    app: monitoring-backend
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-backend
  template:
    metadata:
      labels:
        app: monitoring-backend
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/actuator/prometheus"  # 🔒 Chemin pour les métriques Prometheus
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 0
        runAsNonRoot: true
        fsGroup: 2000

      imagePullSecrets:
        - name: gitlab-registry-secret
      volumes:
        - name: tmp-volume
          emptyDir: {}  # 🔒 Volume temporaire pour /tmp
        - name: data-storage
          emptyDir: {}  # Volume temporaire pour les données, si nécessaire
      containers:
        - name: monitoring-backend
          image: monitoring-backend:1.0.0
          imagePullPolicy: IfNotPresent # Pour le développement local, utiliser Always en prod
          ports:
            - containerPort: 9090
          env:
            - name: SERVER_PORT
              value: "9090"
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: REDIS_HOST
              value: "redis-service"  # Nom du service Redis dans le même namespace
            - name: REDIS_PORT
              value: "6379"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"  
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "400m"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp  # 🔥 Permet à l'app d’écrire dans /tmp
            - name: data-storage
              mountPath: /app/data  # Monter le volume de données si nécessaire
