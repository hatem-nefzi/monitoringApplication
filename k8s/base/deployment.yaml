apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-backend
  labels:
    app: monitoring-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monitoring-backend
  template:
    metadata:
      labels:
        app: monitoring-backend
    spec:
      containers:
      - name: monitoring-backend
        imagePullPolicy: Always
        ports:
        - containerPort: 9090
        # Clean env section - no conflicting value/valueFrom
        env:
        - name: SERVER_PORT
          value: "9090"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"