apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: monitoring-backend-vpa
spec:
  targetRef:
    apiVersion: "apps/v1"
    kind: Deployment
    name: monitoring-backend
  updatePolicy:
    updateMode: "Off"  # Start with recommendations only (safe mode)
  resourcePolicy:
    containerPolicies:
    - containerName: "monitoring-backend"
      minAllowed:
        cpu: "50m"
        memory: "128Mi"
      maxAllowed:
        cpu: "1"
        memory: "1Gi"