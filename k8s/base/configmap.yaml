apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-backend-config
data:
  application.yaml: |
    server:
      port: 9090
    spring:
      profiles:
        active: kubernetes
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          probes:
            enabled: true
    logging:
      level:
        com.monitoring: INFO