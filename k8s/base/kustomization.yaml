apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: monitoring-backend-base

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - rbac/service-account.yaml
  - rbac/cluster-role.yaml
  - rbac/cluster-role-binding.yaml
  - redis.yaml
  - observability-namespace.yaml
  - jaeger.yaml
  - otel-collector.yaml
  #adding the rbac for remediator
  #- rbac/remediator-role/default-namespace-delete-role.yaml
  #- rbac/remediator-role/default-namespace-rolebinding.yaml

# Remove commonLabels to prevent Redis from getting backend labels
# Each deployment should have its own specific labels

# Optional: Add a common label that doesn't affect selectors
labels:
  - pairs:
      part-of: monitoring-system
    includeSelectors: false

images:
  - name: monitoring-backend