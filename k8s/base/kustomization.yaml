apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: monitoring-backend-base

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml

commonLabels:
  app: monitoring-backend
  component: backend
  part-of: monitoring-system

images:
  - name: monitoring-backend
   

configMapGenerator:
  - name: monitoring-backend-config
    literals:
      - LOG_LEVEL=INFO
      - SERVER_PORT=9090