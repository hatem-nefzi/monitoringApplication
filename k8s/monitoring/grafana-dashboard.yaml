# k8s/monitoring/grafana-dashboard.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: monitoring-backend-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  dashboard.json: |
    {
      "dashboard": {
        "title": "Monitoring Backend",
        "panels": [
          {
            "id": 1,
            "title": "Application Status",
            "type": "stat",
            "targets": [{"expr": "up{job=\"monitoring-backend-service\"}"}],
            "gridPos": {"h": 6, "w": 8, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "HTTP Requests/sec",
            "type": "graph", 
            "targets": [{"expr": "rate(http_server_requests_seconds_count{job=\"monitoring-backend-service\"}[5m])"}],
            "gridPos": {"h": 6, "w": 16, "x": 8, "y": 0}
          },
          {
            "id": 3,
            "title": "JVM Memory Usage",
            "type": "graph",
            "targets": [{"expr": "jvm_memory_used_bytes{job=\"monitoring-backend-service\"}"}],
            "gridPos": {"h": 6, "w": 24, "x": 0, "y": 6}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }
