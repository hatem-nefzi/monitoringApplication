# k8s/monitoring/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: monitoring-backend-monitor
  labels:
    app: monitoring-backend
    release: prometheus
spec:
  selector:
    matchLabels:
      app: monitoring-backend
  endpoints:
  - port: http
    path: /actuator/prometheus
    interval: 30s
    scrapeTimeout: 10s