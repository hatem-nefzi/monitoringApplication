apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: monitoring-backend
  name: monitoring-backend-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
