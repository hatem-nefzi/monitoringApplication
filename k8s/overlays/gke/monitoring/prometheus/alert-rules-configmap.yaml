apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
  labels:
    app: prometheus
data:
  prometheus.rules.yaml: |
    groups:
    - name: workload.rules
      rules:
        - alert: ModerateCPUUsage
          expr: sum(rate(container_cpu_usage_seconds_total{container!="",pod!=""}[2m])) by (pod) > 0.2
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Moderate CPU usage detected"
            description: "Pod {{ $labels.pod }} is using more than 20% CPU for 2 minutes."

        - alert: HighMemoryUsage
          expr: sum(container_memory_usage_bytes{container!="",pod!=""}) by (pod) > 100 * 1024 * 1024
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage detected"
            description: "Pod {{ $labels.pod }} is using over 100MiB of memory."
