apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
  labels:
    app: alertmanager
data:
  alertmanager.yml: |
    global:
      smtp_smarthost: 'smtp.gmail.com:587'
      smtp_hello: 'alertmanager'
      smtp_from: 'SMTP_FROM_PLACEHOLDER'  # to be replaced
      smtp_auth_username: 'SMTP_AUTH_USERNAME'
      smtp_auth_password: 'SMTP_AUTH_PASSWORD'
      smtp_require_tls: true

    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'email-alerts'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
        repeat_interval: 30m
      - match:
          severity: warning
        receiver: 'warning-alerts'
        repeat_interval: 2h

    receivers:
    - name: 'email-alerts'
      email_configs:
      - to: 'ALERT_EMAIL_PLACEHOLDER'

    - name: 'critical-alerts'
      email_configs:
      - to: 'ALERT_EMAIL_PLACEHOLDER'

    - name: 'warning-alerts'
      email_configs:
      - to: 'ALERT_EMAIL_PLACEHOLDER'

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'instance']
