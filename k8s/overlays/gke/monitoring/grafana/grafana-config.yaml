apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  kubernetes-overview.json: |
    {
      "id": null,
      "title": "Kubernetes Overview",
      "tags": ["kubernetes"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "id": 1,
          "title": "Pod CPU Usage (Backend)",
          "type": "graph",
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{pod=~\"monitoring-backend.*\"}[5m])",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "yAxes": [
            {
              "label": "CPU Usage",
              "format": "percentunit"
            }
          ]
        },
        {
          "id": 2,
          "title": "Pod Memory Usage (Backend)",
          "type": "graph",
          "targets": [
            {
              "expr": "container_memory_usage_bytes{pod=~\"monitoring-backend.*\"}",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "yAxes": [
            {
              "label": "Memory Usage",
              "format": "bytes"
            }
          ]
        },
        {
          "id": 3,
          "title": "Service Availability (Backend)",
          "type": "stat",
          "targets": [
            {
              "expr": "up{job=\"monitoring-backend\"}",
              "legendFormat": "{{kubernetes_name}}"
            }
          ],
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
        },
        {
          "id": 4,
          "title": "Service Availability (Frontend)",
          "type": "stat",
          "targets": [
            {
              "expr": "up{job=\"monitoring-frontend\"}",
              "legendFormat": "{{kubernetes_name}}"
            }
          ],
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16}
        },
        {
          "id": 5,
          "title": "Pod CPU Usage (Frontend)",
          "type": "graph",
          "targets": [
            {
              "expr": "rate(container_cpu_usage_seconds_total{pod=~\"monitoring-frontend.*\"}[5m])",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24},
          "yAxes": [
            {
              "label": "CPU Usage",
              "format": "percentunit"
            }
          ]
        },
        {
          "id": 6,
          "title": "Pod Memory Usage (Frontend)",
          "type": "graph",
          "targets": [
            {
              "expr": "container_memory_usage_bytes{pod=~\"monitoring-frontend.*\"}",
              "legendFormat": "{{pod}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24},
          "yAxes": [
            {
              "label": "Memory Usage",
              "format": "bytes"
            }
          ]
        }
      ],
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "refresh": "5s"
    }
