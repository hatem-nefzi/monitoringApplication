
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  
  # Prometheus
  - prometheus/prometheus-rbac.yaml
  - prometheus/prometheus-config.yaml
  - prometheus/prometheus-deployment.yaml
  - prometheus/prometheus-service.yaml
  # Grafana
  - grafana/grafana-rbac.yaml
  - grafana/grafana-config.yaml
  - grafana/grafana-deployment.yaml
  - grafana/grafana-service.yaml
  # Ingress
  - ingress/monitoring-ingress.yaml
  - ingress/alertmanager-ingress.yaml
  # Alertmanager
  - alertmanager/service.yaml
  - alertmanager/deployment.yaml
  - alertmanager/config.yaml
  # Alert Rules ConfigMap
  - prometheus/alert-rules-configmap.yaml
  # Always Alert Rule
  - prometheus/rules/always-alert.rules.yaml
  
  
  
 
  
commonLabels:
  monitoring: "true"