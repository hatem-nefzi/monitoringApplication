apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-backend

resources:
  - ../../base
  - canary-service.yaml # Service for canary deployment
  
  

  

patchesStrategicMerge:
  - patches/deployment-patch.yaml
  - patches/cluster-rolebinding-patch.yaml
  - patches/deployment-canary.yaml # Canary deployment for monitoring backend

images:
  - name: monitoring-backend
    newName: registry.proxiad-axe-seine.com/proxiad-academie/ops-monitoring
    newTag: latest

commonLabels:
  environment: gke
  platform: gcp

configMapGenerator:
  - name: monitoring-backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=gke
      - PLATFORM=gcp
