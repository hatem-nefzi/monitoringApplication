apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring-backend

resources:
  - ../../base

patchesStrategicMerge:
  - patches/deployment-patch.yaml

images:
  - name: monitoring-backend
    newName: hatemnefzi/monitoring-backend

commonLabels:
  environment: gke
  platform: gcp

configMapGenerator:
  - name: monitoring-backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=INFO
      - ENVIRONMENT=gke
      - PLATFORM=gcp