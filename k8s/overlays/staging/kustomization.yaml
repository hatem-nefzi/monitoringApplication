apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base

# Use 'patches' instead of deprecated 'patchesStrategicMerge'
patches:
  - path: patches/deployment-patch.yaml

images:
  - name: monitoring-backend
    newName: monitoring-backend  # This will be replaced by CI
    # No newTag here - let CI set it dynamically

# Use 'labels' instead of deprecated 'commonLabels'
labels:
  - pairs:
      environment: staging

configMapGenerator:
  - name: monitoring-backend-config
    behavior: replace
    literals:
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=staging
      - SERVER_PORT=9090