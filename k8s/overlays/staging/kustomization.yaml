apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: staging
resources:
  - ../../base
patchesStrategicMerge:
  - patches/deployment-patch.yaml
  - patches/image-pull-policy.yaml  # Add this patch
images:
  - name: monitoring-backend
    newName: hatemnefzi/monitoring-backend
    newTag: latest
commonLabels:
  environment: staging
configMapGenerator:
  - name: monitoring-backend-config
    behavior: replace
    literals:
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=staging
      - SERVER_PORT=9090