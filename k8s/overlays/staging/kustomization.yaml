apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: staging

resources:
  - ../../base

patchesStrategicMerge:
  - patches/deployment-patch.yaml

images:
  - name: monitoring-backend
    newName: hatemnefzi/monitoring-backend
    #no newTage here , let CI set it dynamically
commonLabels:
  environment: staging

configMapGenerator:
  - name: monitoring-backend-config
    behavior: merge
    literals:
      - LOG_LEVEL=DEBUG
      - ENVIRONMENT=staging