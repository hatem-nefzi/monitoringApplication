apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metrics-reader
  namespace: staging
rules:
  # Metrics permissions
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  
  # Core API permissions
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list"]
  
  # Apps API permissions (for deployments)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  
  # Networking API permissions (for ingresses)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"] 
    verbs: ["get", "list"]