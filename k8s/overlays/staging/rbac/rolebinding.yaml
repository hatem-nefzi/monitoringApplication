# k8s/overlays/staging/rbac/rolebinding.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metrics-reader-binding
  namespace: staging
subjects:
  - kind: ServiceAccount
    name: monitoring-backend
    namespace: staging
roleRef:
  kind: Role
  name: metrics-reader
  apiGroup: rbac.authorization.k8s.io
