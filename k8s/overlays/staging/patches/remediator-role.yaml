apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: monitoring-backend-remediator
  namespace: staging
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: monitoring-backend-remediator-binding
  namespace: staging
subjects:
- kind: ServiceAccount
  name: monitoring-backend-sa
  namespace: staging
roleRef:
  kind: Role
  name: monitoring-backend-remediator
  apiGroup: rbac.authorization.k8s.io