apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-backend
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: monitoring-backend
      containers:
        - name: monitoring-backend
          imagePullPolicy: Always
          resources:
            requests:
              memory: "192Mi"
              cpu: "100m"
            limits:
              memory: "384Mi"
              cpu: "200m"
          volumeMounts:
            - name: h2-data
              mountPath: /app/data
          env:
            # Staging-specific environment variables
            - name: SPRING_PROFILES_ACTIVE
              value: "staging"
            - name: SERVER_PORT
              value: "9090"
            
            # Override H2 database path to writable location
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:h2:file:/app/data/costdb;AUTO_SERVER=TRUE"
            - name: SPRING_DATASOURCE_DRIVER_CLASS_NAME
              value: "org.h2.Driver"
            - name: SPRING_DATASOURCE_USERNAME
              value: "sa"
            - name: SPRING_DATASOURCE_PASSWORD
              value: ""
            
            # JPA Configuration
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: "update"
            - name: SPRING_JPA_SHOW_SQL
              value: "false"
            
            # H2 Console
            - name: SPRING_H2_CONSOLE_ENABLED
              value: "true"
            - name: SPRING_H2_CONSOLE_PATH
              value: "/h2-console"
            
            # Logging
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: monitoring-backend-config
                  key: LOG_LEVEL
            
            - name: ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: monitoring-backend-config
                  key: ENVIRONMENT
            
            - name: KUBERNETES_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            
            # Redis Configuration
            - name: REDIS_HOST
              value: "redis-service"
            - name: REDIS_PORT  
              value: "6379"
            
            # OpenTelemetry Configuration
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
            - name: OTEL_SERVICE_NAME
              value: "monitoring-backend-staging"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
      
      # Volume for H2 database
      volumes:
        - name: h2-data
          emptyDir: {}