apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-backend
spec:
  replicas: 1
  template:
    spec:
      serviceAccountName: monitoring-backend
      containers:
      - name: monitoring-backend
        imagePullPolicy: Always  # Force pull every time
        resources:
          requests:
            memory: "192Mi"
            cpu: "100m"
          limits:
            memory: "384Mi"
            cpu: "200m"
        env:
        # Staging-specific environment variables
        - name: SPRING_PROFILES_ACTIVE
          value: "staging"
        - name: SERVER_PORT
          value: "9090"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: monitoring-backend-config
              key: LOG_LEVEL
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: monitoring-backend-config
              key: ENVIRONMENT
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # Preserve existing Redis and OTEL env vars from base
        - name: REDIS_HOST
          value: "redis-service"
        - name: REDIS_PORT  
          value: "6379"
        - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
          value: "http://otel-collector.observability.svc.cluster.local:4318/v1/traces"
        - name: OTEL_SERVICE_NAME
          value: "monitoring-backend"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "none"