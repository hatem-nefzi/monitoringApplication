# K3s staging — provide K3S_* (server/certs/keys) as CI masked vars
variables:
  ENVIRONMENT_STAGING: "production"
  PROMETHEUS_STAGING_URL: "http://prometheus.production.local"
  GRAFANA_STAGING_URL: "http://grafana.production.local"
  # K3S_* en CI vars : K3S_SERVER, K3S_CA_CERT, K3S_CLIENT_CERT, K3S_CLIENT_KEY
