deploy:staging:
  extends:
    - .k8s_job
  stage: deploy-production
  variables:
    TARGET_NAMESPACE: "$ENVIRONMENT_STAGING"
    OVERLAY_DIR: "k8s/overlays/production"
    KUBECONFIG: "$CI_PROJECT_DIR/.kube/config"
  before_script:
    - !reference [.k8s_job, before_script]  # ✅ Inherit base setup
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: ${K3S_SERVER}
          certificate-authority-data: ${K3S_CA_CERT}
        name: k3s
      contexts:
      - context:
          cluster: k3s
          user: k3s-user
          namespace: ${TARGET_NAMESPACE}  # Changed from ENVIRONMENT_PRODUCTION
        name: k3s
      current-context: k3s
      kind: Config
      users:
      - name: k3s-user
        user:
          client-certificate-data: ${K3S_CLIENT_CERT}
          client-key-data: ${K3S_CLIENT_KEY}
      EOF
    - kubectl cluster-info
    # DEBUG: Check what variables are available
    - echo "IMAGE_VERSIONED = ${IMAGE_VERSIONED}"
    - echo "CI_COMMIT_SHORT_SHA = ${CI_COMMIT_SHORT_SHA}"
    - env | grep -E "(IMAGE|CI_COMMIT|TAG)"
  script:
    - !reference [.k8s_prepare_script, script]
    - !reference [.k8s_apply_overlay_script, script]
 