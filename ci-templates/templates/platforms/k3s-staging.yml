include:
  - local: "ci-templates/templates/core/.gitlab-ci-kubernetes.yml"
  - local: "ci-templates/templates/shared/variables/dev.yml"
  - local: "ci-templates/templates/shared/variables/computed.yml"

deploy:production:
  extends: .k8s_job
  stage: deploy-production
  variables:
    TARGET_NAMESPACE: "production"
    OVERLAY_DIR: "k8s/overlays/production"
    KUBECONFIG: "$CI_PROJECT_DIR/.kube/config"
  before_script:
    - !reference [.k8s_job, before_script]
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: ${K3D_REMOTE_SERVER}
          insecure-skip-tls-verify: true
        name: k3d-remote
      contexts:
      - context:
          cluster: k3d-remote
          user: gitlab-ci
          namespace: ${TARGET_NAMESPACE}
        name: k3d-remote
      current-context: k3d-remote
      kind: Config
      users:
      - name: gitlab-ci
        user:
          token: ${K3D_REMOTE_TOKEN}
      EOF
    - kubectl cluster-info
  script:
    - !reference [.k8s_prepare_script, script]
    - !reference [.k8s_apply_overlay_script, script]

 