deploy:dev:
  extends: .k8s_job
  stage: deploy-staging
  variables:
    TARGET_NAMESPACE: "$ENVIRONMENT_DEV"
    OVERLAY_DIR: "k8s/overlays/staging"
    KUBECONFIG: "$CI_PROJECT_DIR/.kube/config"
    LOCAL_K3D_PORT: "39165"
  before_script:
    - !reference [.k8s_job, before_script]
    - apk add --no-cache openssh-client
    # Setup SSH
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY_LOCAL" | base64 -d > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $LOCAL_MACHINE_IP >> ~/.ssh/known_hosts 2>/dev/null
    # Create SSH tunnel (maps remote port 6443 to local k3d port 39165)
    - ssh -f -N -L 6443:127.0.0.1:${LOCAL_K3D_PORT} ${LOCAL_MACHINE_USER}@${LOCAL_MACHINE_IP} || { echo "SSH tunnel failed"; exit 1; }
    - sleep 2  # Give tunnel time to establish
    # Create kubeconfig
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: https://127.0.0.1:6443
          insecure-skip-tls-verify: true
        name: staging
      contexts:
      - context:
          cluster: staging
          user: gitlab-ci
          namespace: ${TARGET_NAMESPACE}
        name: staging
      current-context: staging
      kind: Config
      users:
      - name: gitlab-ci
        user:
          token: ${K3D_STAGING_TOKEN}
      EOF
    - kubectl cluster-info
    - kubectl get nodes
  script:
    - !reference [.k8s_prepare_script, script]
    - !reference [.k8s_apply_overlay_script, script]
  after_script:
    # Clean up SSH tunnel
    - pkill -f "ssh.*6443:127.0.0.1:$LOCAL_K3D_PORT" || true
