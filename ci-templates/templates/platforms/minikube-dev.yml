include:
  - local: "ci-templates/templates/core/.gitlab-ci-kubernetes.yml"
  - local: "ci-templates/templates/shared/variables/dev.yml"
  - local: "ci-templates/templates/shared/variables/computed.yml"

deploy:dev:
  extends: .k8s_job
  entrypoint: [""]
  stage: deploy-staging
  variables:
    TARGET_NAMESPACE: "$ENVIRONMENT_DEV"
    OVERLAY_DIR: "k8s/overlays/staging"
    KUBECONFIG: "$CI_PROJECT_DIR/.kube/config"
  before_script:
    - !reference [.k8s_job, before_script]  # ✅ Inherit base setup
    - apk add --no-cache ca-certificates
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: https://${MINIKUBE_IP}:${MINIKUBE_PORT}
          insecure-skip-tls-verify: true
        name: minikube
      contexts:
      - context:
          cluster: minikube
          user: gitlab-ci
          namespace: ${TARGET_NAMESPACE}  # ✅ Fixed namespace
        name: minikube
      current-context: minikube
      kind: Config
      users:
      - name: gitlab-ci
        user:
          token: ${MINIKUBE_TOKEN}
      EOF
    - kubectl cluster-info
  script:
    - !reference [.k8s_prepare_script, script]
    - !reference [.k8s_apply_overlay_script, script]