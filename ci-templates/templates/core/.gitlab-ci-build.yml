# templates/core/.gitlab-ci-build.yml
# Template de build générique avec cache optimisé

include:
  - local: "ci-templates/templates/core/.gitlab-ci-foundation.yml"
# Maven build job - Pipeline-as-a-Platform: délégation au conteneur Maven
build:
  extends: .maven_job
  stage: build
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH