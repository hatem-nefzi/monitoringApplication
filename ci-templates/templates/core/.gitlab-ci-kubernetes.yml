include:
  - local: "ci-templates/templates/core/.gitlab-ci-foundation.yml"

# ---------- Reusable script blocks (hidden jobs) ----------
.k8s_setup_script:
  script:
    - apk add --no-cache curl jq bash gettext
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version

.k8s_prepare_script:
  script:
    - kubectl create namespace "${TARGET_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
    - kubectl delete secret ${REGISTRY_SECRET_NAME:-gitlab-registry-secret} -n ${TARGET_NAMESPACE} --ignore-not-found=true
    - kubectl create secret docker-registry ${REGISTRY_SECRET_NAME:-gitlab-registry-secret} --docker-server="$REGISTRY_HOST" --docker-username="$CI_REGISTRY_USER" --docker-password="$GITLAB_PERSONAL_TOKEN" -n "${TARGET_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -

.k8s_apply_overlay_script:
  script:
    - cd "$OVERLAY_DIR"
    - kustomize edit fix || true
    - kustomize edit set image ${APP_NAME}=${IMAGE_VERSIONED}
    - kustomize build . | tee "$CI_PROJECT_DIR/k8s-${TARGET_NAMESPACE}.yaml" | kubectl apply -f -
    - kubectl rollout status deployment/${APP_NAME} -n ${TARGET_NAMESPACE} --timeout=600s

.k8s_gitops_script:
  script:
    - cd "$OVERLAY_DIR"
    
    
    
    # Configure git
    - git config --global user.email "gitlab-ci@${CI_PROJECT_NAMESPACE}.com"
    - git config --global user.name "GitLab CI Bot"

    # Pull latest changes before pushing (handles concurrent jobs)
    - git pull "https://oauth2:${GITLAB_TOKEN_GITOPS}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" ${CI_COMMIT_REF_NAME} --rebase || true
    
    # Update kustomization with the new image tag
    - kustomize edit fix || true
    - kustomize edit set image ${APP_NAME}=${IMAGE_VERSIONED}
    
    # Check if there are changes to commit
    - |
      if git diff --quiet HEAD -- kustomization.yaml; then
        echo "No changes to image tag, skipping commit"
        exit 0
      fi

    
   
    
    # Commit and push the changes
    - git add kustomization.yaml
    - git commit -m "chore update ${APP_NAME} image to ${CI_COMMIT_SHORT_SHA} [ci skip]"
    - git push "https://oauth2:${GITLAB_TOKEN_GITOPS}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_COMMIT_REF_NAME}
    
    # Optional: Trigger ArgoCD sync (or let it auto-sync)
    - echo "Image tag updated in Git. ArgoCD will deploy ${APP_NAME}:${CI_COMMIT_SHORT_SHA}"

.k8s_apply_monitoring_overlay_script:
  script:
    - cd "$OVERLAY_DIR"
    - kustomize build . | kubectl apply -f -
    - kubectl rollout status deployment/prometheus -n ${GKE_MONITORING_NAMESPACE} --timeout=600s || echo "Prometheus rollout may take longer"
    - kubectl rollout status deployment/grafana -n ${GKE_MONITORING_NAMESPACE} --timeout=600s || echo "Grafana rollout may take longer"

# ---------- Base job you can extend ----------
.k8s_job:
  extends: .default_job
  image: dtzar/helm-kubectl:latest 
  variables:
    KUSTOMIZE_VERSION: "v5.4.3"
  before_script:
    - !reference [.k8s_setup_script, script]
