include:
  - local: "ci-templates/templates/core/.gitlab-ci-foundation.yml"

# OWASP + Trivy

# templates/core/.gitlab-ci-security.yml
# Template de sécurité - OWASP Dependency Check et Trivy

# OWASP Dependency Check - Pipeline-as-a-Platform: délégation au conteneur Maven+OWASP
owasp_dependency_check:
  extends: .maven_job
  stage: security
  needs: ["build"]
  variables:
    FAIL_ON_CVSS: 9
  before_script:
    - mkdir -p .cache/dependency-check
    - if [ -f package.json ]; then npm install --package-lock-only; fi
  script:
    - echo "Running OWASP Dependency Check..."
    - |
      mvn org.owasp:dependency-check-maven:12.1.0:check \
        -Dformat=ALL \
        -DoutputDirectory=./target \
        -DsuppressionFile=.gitlab/dependency-check-suppressions.xml \
        -DdataDirectory=.cache/dependency-check \
        -Dnvd.api.key=${NVD_API_KEY} \
        -DfailBuildOnCVSS=${FAIL_ON_CVSS}
    - ls -la target/ | grep dependency-check
  artifacts:
    paths:
      - target/dependency-check-report.*
    reports:
      dependency_scanning: target/dependency-check-report.json
    expire_in: 1 week
  cache:
    key: "dependency-check-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/dependency-check/
    policy: pull-push
  rules:
    - if: $CI_COMMIT_BRANCH

# Container security scan - Pipeline-as-a-Platform: délégation au conteneur Trivy
container_scan:
  extends: .job_definition
  stage: docker_security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["docker_publish"]
  script:
    - echo "🔍 Scanning container image for vulnerabilities..."
    - echo "Image: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --insecure --output gl-container-scanning-report.json "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    when: always
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH

# Kubernetes manifest scan - Pipeline-as-a-Platform: délégation au conteneur Trivy Config
k8s_manifest_scan:
  extends: .job_definition
  stage: docker_security
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo " Scanning Kubernetes manifests for security misconfigurations..."
    # Scan base manifests
    - |
      trivy config k8s/base \
        --exit-code 0 \
        --severity MEDIUM,HIGH,CRITICAL || echo "Scan finished with issues in base"
    # Scan each overlay separately
    - |
      for overlay in k8s/overlays/*; do
        echo " Scanning $overlay ..."
        trivy config "$overlay" \
          --exit-code 0 \
          --severity MEDIUM,HIGH,CRITICAL || echo "Scan finished with issues in $overlay"
      done
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH


# File: templates/core/.gitlab-ci-security.yml
# Simple reusable templates for container image signing and verification

variables:
  COSIGN_VERSION: "v2.2.4"
  COSIGN_EXPERIMENTAL: "1"

# Base Cosign setup
.cosign_base:
  image: hatemnefzi/maven-docker:latest
  variables:
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update && apt-get install -y curl wget
    - wget "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    - mv cosign-linux-amd64 /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"

# Image signing job - ready to use
sign_image:
  extends: .cosign_base
  stage: image_signing
  needs: ["docker_publish","container_scan"]
  variables:
    CERTIFICATE_IDENTITY: "${PROJECT_CERT_IDENTITY:-${DEFAULT_CERT_IDENTITY}}"
  script:
    - echo "=== SIGNING IMAGE WITH COSIGN ==="
    - echo "Digest to sign  $IMAGE_DIGEST"
    - cosign sign --yes "$IMAGE_DIGEST"
    - echo "✅ Image signed successfully!"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop|experiment)$/

# Image verification job - ready to use  
verify_image:
  extends: .cosign_base
  stage: image_verification
  needs: ["docker_publish", "sign_image"]
  variables:
    CERTIFICATE_IDENTITY: "${PROJECT_CERT_IDENTITY:-${DEFAULT_CERT_IDENTITY}}"
    CERTIFICATE_OIDC_ISSUER: "${PROJECT_OIDC_ISSUER:-${CERTIFICATE_OIDC_ISSUER}}"
  script:
    - echo "=== VERIFYING IMAGE SIGNATURE ==="
    - echo "Digest to verify: $IMAGE_DIGEST"
    - |
      cosign verify "$IMAGE_DIGEST" \
        --certificate-identity-regexp="$CERTIFICATE_IDENTITY" \
        --certificate-oidc-issuer="$CERTIFICATE_OIDC_ISSUER"
    - echo "✅ Signature verification succeeded!"
  rules:
    - if: $CI_COMMIT_BRANCH =~ /^(main|develop|experiment)$/



# Quick verification for deployment jobs
.verify_before_deploy:
  before_script:
    - apk add --no-cache curl wget
    - wget "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
    - mv cosign-linux-amd64 /usr/local/bin/cosign
    - chmod +x /usr/local/bin/cosign
    - cosign login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - echo "🔒 Verifying image signature before deployment..."
    - |
      cosign verify "$IMAGE_DIGEST" \
        --certificate-identity-regexp="$CERTIFICATE_IDENTITY" \
        --certificate-oidc-issuer="$CERTIFICATE_OIDC_ISSUER"
    - echo "✅ Image signature verified!"