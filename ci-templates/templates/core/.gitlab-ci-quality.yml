# Alternative: If you need to store SonarQube files as artifacts
sonarqube_scan:
  extends: .maven_job
  stage: sonarqube
  needs: ["build"]
  variables:
    SONAR_SCANNER_OPTS: "-Xmx1024m"
  script:
    - echo "Running SonarQube analysis..."
    - >
      mvn sonar:sonar
      -Dsonar.projectKey=monitoring-backend
      -Dsonar.projectName=monitoring-backend
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.java.binaries=target/classes
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.sources=src/main/java
      -Dsonar.tests=""
      -Dsonar.junit.reportPaths=target/surefire-reports
  artifacts:
    paths:
      - "target/sonar/**/*"  # SonarQube working directory
      - ".scannerwork/**/*"  # Scanner working directory
    expire_in: 1 day
    when: always
  allow_failure: true
  rules:
    - if: $CI_COMMIT_BRANCH