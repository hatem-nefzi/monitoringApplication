spring.application.name=monitoring_app
# Server
server.port=9090


# Actuator and Metrics (added prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.server.port=9090
management.endpoint.health.enabled=true
# Kubernetes
# Uses default kubeconfig location (~/.kube/config)

# Set logging levels
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.io.kubernetes=WARN

#kubernetes.namespace=production instead of this we r gonna use this 
kubernetes.namespace=${KUBERNETES_NAMESPACE:default}





# OpenTelemetry Tracing Configuration
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability.svc.cluster.local:4318/v1/traces}

# Service identification
otel.service.name=monitoring-backend
otel.service.version=1.0.0
otel.resource.attributes=deployment.environment=dev,service.namespace=monitoring

# Enable tracing for actuator endpoints
management.tracing.enabled=true

# Optional: Add trace ID to logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg [traceId=%X{traceId}, spanId=%X{spanId}] %n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg [traceId=%X{traceId}, spanId=%X{spanId}] %n


# Redis Configuration - Make it explicit
# Redis Configuration - Use the correct environment variables
spring.redis.host=${REDIS_HOST:redis-service}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.database=0

# Use Lettuce (default) instead of Jedis for better async support
spring.redis.lettuce.pool.enabled=true
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Connection timeouts
spring.redis.connect-timeout=2000ms
spring.redis.client-type=lettuce

# Optional: SSL settings (only if needed)
spring.redis.ssl=false

# Logging for debugging
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG
logging.level.com.example.demo.service.CacheService=DEBUG
logging.level.com.example.demo.config.RedisConfig=DEBUG