spring.application.name=monitoring_app
# Server
server.port=9090


# Actuator and Metrics (added prometheus)
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
management.server.port=9090
management.endpoint.health.enabled=true
# Kubernetes
# Uses default kubeconfig location (~/.kube/config)

# Set logging levels
logging.level.com.example.demo=DEBUG
logging.level.org.springframework.web=INFO
logging.level.io.kubernetes=WARN

#kubernetes.namespace=production instead of this we r gonna use this 
kubernetes.namespace=${KUBERNETES_NAMESPACE:default}





# OpenTelemetry Tracing Configuration
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector.observability.svc.cluster.local:4318/v1/traces}

# Service identification
otel.service.name=monitoring-backend
otel.service.version=1.0.0
otel.resource.attributes=deployment.environment=dev,service.namespace=monitoring

# Enable tracing for actuator endpoints
management.tracing.enabled=true

# Optional: Add trace ID to logs
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg [traceId=%X{traceId}, spanId=%X{spanId}] %n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} - %msg [traceId=%X{traceId}, spanId=%X{spanId}] %n


# Redis Configuration - Make it explicit
# Redis Configuration - Use the correct environment variables
spring.redis.host=${REDIS_HOST:redis-service}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.database=0

# Use Lettuce (default) instead of Jedis for better async support
spring.redis.lettuce.pool.enabled=true
spring.redis.lettuce.pool.max-active=8
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=0
spring.redis.lettuce.pool.max-wait=-1ms

# Connection timeouts
spring.redis.connect-timeout=2000ms
spring.redis.client-type=lettuce

# Optional: SSL settings (only if needed)
spring.redis.ssl=false

# Logging for debugging
logging.level.org.springframework.data.redis=DEBUG
logging.level.io.lettuce.core=DEBUG
logging.level.com.example.demo.service.CacheService=DEBUG
logging.level.com.example.demo.config.RedisConfig=DEBUG


# Enable ALL observability features
management.observations.enabled=true
management.tracing.enabled=true



# Enable all instrumentations
management.opentelemetry.tracing.enabled=true

# Make sure micrometer tracing is enabled
management.metrics.tags.application=${spring.application.name}
# Add this to ensure observations propagate properly
management.observations.key-values.application=${spring.application.name}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# ============================================
#  COST MONITORING CONFIGURATION
# ============================================

# Cost Rates (Based on AWS pricing - adjust for your cloud provider)
# These are approximate rates for demonstrating cost calculation

# CPU Cost: Per core per hour (USD)
# AWS t3.medium equivalent: ~$0.0416/hour for 2 vCPU = ~$0.021/vCPU
# Using slightly higher rate for demo purposes
cost.cpu.per.hour=0.031

# Memory Cost: Per GB per hour (USD)  
# AWS t3.medium equivalent: ~$0.0416/hour for 4GB = ~$0.010/GB
# Using lower rate for typical pricing
cost.memory.gb.per.hour=0.004

# Storage Cost: Per GB per month (USD)
# AWS EBS gp3: ~$0.08/GB-month
cost.storage.gb.per.month=0.10

# Cost Analysis Settings
cost.analysis.enabled=true
cost.analysis.currency=USD

# Efficiency Thresholds (percentage)
cost.efficiency.threshold.good=70
cost.efficiency.threshold.warning=50
cost.efficiency.threshold.critical=30



# Database Configuration (H2 for demo, use PostgreSQL in production)

spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.datasource.url=jdbc:h2:file:/home/hatemnefzi/cost-monitoring/costdb

spring.jpa.show-sql=false

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Enable scheduling for automatic snapshots
spring.task.scheduling.pool.size=2

spring.jpa.hibernate.ddl-auto=update


# Cache TTL Configuration (in seconds)
cache.ttl.pod-metrics=30
cache.ttl.cost-analysis=300
cache.ttl.cluster-summary=600
cache.ttl.recommendations=900
cache.ttl.anomalies=120
cache.ttl.forecast=1800