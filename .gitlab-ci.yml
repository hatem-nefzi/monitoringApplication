.job_template: &job_definition
  tags:
    - docker
  before_script:
    - echo "starting job in ${CI_JOB_NAME} stage"

.maven_job: &maven_definition
  <<: *job_definition
  image: hatemnefzi/maven-docker:latest
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - export MAVEN_HOME=/usr/share/maven
    - export PATH=$MAVEN_HOME/bin:$PATH

.kubectl_job: &kubectl_definition
  <<: *job_definition
  image: alpine/k8s:1.25.10
  variables:
    KUBECONFIG: /tmp/kubeconfig/config


# Template for production jobs (runs on VM2 - K3s)
.production_job: &production_job_definition
  tags:
    - production  # New runner tag
    - gitlab-runner-prod
    - kubernetes
    - minikube
    - registry
  variables:
    TARGET_ENV: "production"
    REGISTRY_URL: "$PRODUCTION_REGISTRY_URL"
    KUBE_SERVER: "https://$PRODUCTION_VM_IP:6443"  # K3s uses HTTPS and port 6443


# Common job definitions
.monitoring_backend_deploy_base: &monitoring_backend_deploy_base
  <<: *job_definition
  image: alpine/k8s:1.30.0
  variables:
    APP_NAME: "monitoring-backend"
    CONTAINER_PORT: 9090
    SERVICE_PORT: 80
    KUSTOMIZE_VERSION: "v5.4.3"
  before_script:
    - apk add --no-cache curl jq gettext
    - echo "Installing Kustomize..."
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version

.monitoring_staging_deploy: &monitoring_staging_deploy
  <<: *monitoring_backend_deploy_base
  variables:
    ENVIRONMENT: staging
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
    HOST_IP: "172.17.0.1"
    KUBECTL_VERSION: "v1.32.3"
  before_script:
    - !reference [.monitoring_backend_deploy_base, before_script]
    - curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: http://${HOST_IP}:8888
          insecure-skip-tls-verify: true
        name: minikube
      contexts:
      - context:
          cluster: minikube
          user: gitlab-ci
        name: minikube
      current-context: minikube
      kind: Config
      preferences: {}
      users:
      - name: gitlab-ci
        user: {}
      EOF

.monitoring_production_deploy: &monitoring_production_deploy
  <<: *monitoring_backend_deploy_base
  variables:
    ENVIRONMENT: production
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
  before_script:
    - !reference [.monitoring_backend_deploy_base, before_script]
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: ${K3S_SERVER}
          certificate-authority-data: ${K3S_CA_CERT}
        name: k3s-cluster
      contexts:
      - context:
          cluster: k3s-cluster
          user: k3s-user
        name: k3s-context
      current-context: k3s-context
      kind: Config
      preferences: {}
      users:
      - name: k3s-user
        user:
          client-certificate-data: ${K3S_CLIENT_CERT}
          client-key-data: ${K3S_CLIENT_KEY}
      EOF
    - kubectl config current-context
    - kubectl cluster-info

.monitoring_gke_deploy: &monitoring_gke_deploy
  <<: *monitoring_backend_deploy_base
  image: google/cloud-sdk:slim
  variables:
    ENVIRONMENT: gke
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/gke-config"
    USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
    CLOUDSDK_CORE_PROJECT: "$GCP_PROJECT_ID"
  before_script:
    - apt-get update && apt-get install -y curl kubectl google-cloud-cli-gke-gcloud-auth-plugin
    - echo "Installing Kustomize..."
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version
    - echo "Setting up GCP authentication..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file /tmp/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - export CLOUDSDK_CORE_PROJECT=$GCP_PROJECT_ID
    - gcloud services enable container.googleapis.com cloudresourcemanager.googleapis.com
    - gcloud container clusters get-credentials $GKE_CLUSTER_NAME --zone $GKE_ZONE
  after_script:
    - rm -f /tmp/gcp-key.json


checkout:
  <<: *job_definition
  stage: checkout
  before_script:
    - echo "Cleaning previous build artifacts..."
    - rm -rf target/
  script:
    - echo "Checking out code from ${CI_REPOSITORY_URL}"
  artifacts:
    paths:
      - ./

build:
  <<: *maven_definition
  stage: build
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/

sonarqube_scan:
  <<: *maven_definition
  stage: sonarqube
  needs: ["build"]
  variables:
    SONAR_SCANNER_OPTS: "-Xmx1024m"
  script:
    - >
      mvn sonar:sonar
      -Dsonar.projectKey=monitoring-backend
      -Dsonar.projectName=monitoring-backend
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.java.binaries=target/classes
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.sources=src/main/java
      -Dsonar.tests=src/test/java
      -Dsonar.junit.reportPaths=target/surefire-reports

owasp_dependency_check:
  <<: *maven_definition
  stage: security
  needs: ["build"]
  variables:
    FAIL_ON_CVSS: 9 # Only fail on critical vulnerabilities
  before_script:
    - mkdir -p .cache/dependency-check
    - if [ -f package.json ]; then npm install --package-lock-only; fi
  script:
    - |
      mvn org.owasp:dependency-check-maven:12.1.0:check \
        -Dformat=ALL \
        -DoutputDirectory=./target \
        -DsuppressionFile=.gitlab/dependency-check-suppressions.xml \
        -DdataDirectory=.cache/dependency-check \
        -Dnvd.api.key=${NVD_API_KEY} \
        -DfailBuildOnCVSS=${FAIL_ON_CVSS}
    - ls -la target/ | grep dependency-check
  artifacts:
    paths:
      - target/dependency-check-report.*
    reports:
      dependency_scanning: target/dependency-check-report.json
    expire_in: 1 week
  cache:
    key: "dependency-check-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/dependency-check/
    policy: pull-push
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"












docker_publish:
  <<: *job_definition  # Keep your shared job template here
  stage: docker
  image: docker:24.0
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: 1
  before_script:
    - apk add --no-cache curl
    - echo "Using GitLab Container Registry->$CI_REGISTRY_IMAGE"

  script:
    - echo "Building Docker image with version tag and 'latest' tag..."
    - docker build -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" -t "$CI_REGISTRY_IMAGE:latest" .

    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - echo "Pushing versioned and latest tags..."
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"


container_scan:
  <<: *job_definition
  stage: docker_security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["docker_publish"]
  script:
    - echo "Scanning image $VERSIONED_IMAGE"
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --insecure --output gl-container-scanning-report.json "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" # change exit code to 1 for production to failt the ci when we find high risk vulnerability
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"


# Staging Deployment
deploy_monitoring_backend_staging:
  <<: *monitoring_staging_deploy
  stage: deploy-staging
  script:
    - echo "=== DEPLOYING MONITORING BACKEND TO STAGING ==="
    - kubectl cluster-info
    
    # Create namespace
    - kubectl create namespace ${ENVIRONMENT} --dry-run=client -o yaml | kubectl apply -f -
    
    # Update image tag in kustomization
    - |
      echo "Updating image tag in staging kustomization..."
      cd k8s/overlays/staging
      kustomize edit set image monitoring-backend=${MONITORING_BACKEND_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
      cat kustomization.yaml
    
    # Generate and preview manifests
    - |
      echo "=== GENERATED MANIFESTS FOR STAGING ==="
      kustomize build . > ../../../monitoring-backend-staging-manifests.yaml
      cat ../../../monitoring-backend-staging-manifests.yaml
    
    # Apply manifests
    - |
      echo "Applying monitoring backend to staging..."
      kubectl apply -k .
    
    # Wait for deployment.
    - |
      echo "Waiting for deployment to complete..."
      kubectl rollout status deployment/monitoring-backend -n ${ENVIRONMENT} --timeout=300s
    
    # Apply ingress
    - |
      echo "Applying ingress for staging..."
      kubectl apply -f ../../ingress/staging-ingress.yaml
    
    # Show status
    - |
      echo "=== STAGING DEPLOYMENT STATUS ==="
      kubectl get deployments,services,ingress -n ${ENVIRONMENT}
      kubectl get pods -l app=monitoring-backend -n ${ENVIRONMENT}
      kubectl describe pods -l app=monitoring-backend -n ${ENVIRONMENT}
  
  artifacts:
    paths:
      - monitoring-backend-staging-manifests.yaml
    expire_in: 1 week
    when: always
  
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment" || $CI_COMMIT_BRANCH == "develop"







