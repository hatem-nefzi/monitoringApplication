.job_template: &job_definition
  tags:
    - docker
  before_script:
    - echo "starting job in ${CI_JOB_NAME} stage"

.maven_job: &maven_definition
  <<: *job_definition
  image: hatemnefzi/maven-docker:latest
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - export MAVEN_HOME=/usr/share/maven
    - export PATH=$MAVEN_HOME/bin:$PATH

.kubectl_job: &kubectl_definition
  <<: *job_definition
  image: alpine/k8s:1.25.10
  variables:
    KUBECONFIG: /tmp/kubeconfig/config


# Template for production jobs (runs on VM2 - K3s)
.production_job: &production_job_definition
  tags:
    - production  # New runner tag
    - gitlab-runner-prod
    - kubernetes
    - minikube
    - registry
  variables:
    TARGET_ENV: "production"
    REGISTRY_URL: "$PRODUCTION_REGISTRY_URL"
    KUBE_SERVER: "https://$PRODUCTION_VM_IP:6443"  # K3s uses HTTPS and port 6443


# Common job definitions
.monitoring_backend_deploy_base: &monitoring_backend_deploy_base
  <<: *job_definition
  image: alpine/k8s:1.30.0
  variables:
    APP_NAME: "monitoring-backend"
    CONTAINER_PORT: 9090
    SERVICE_PORT: 80
    KUSTOMIZE_VERSION: "v5.4.3"
  before_script:
    - apk add --no-cache curl jq gettext
    - echo "Installing Kustomize..."
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version

.monitoring_staging_deploy: &monitoring_staging_deploy
  <<: *monitoring_backend_deploy_base
  variables:
    ENVIRONMENT: staging
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
    HOST_IP: "172.17.0.1"
    KUBECTL_VERSION: "v1.32.3"
  before_script:
    - !reference [.monitoring_backend_deploy_base, before_script]
    - curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: http://${HOST_IP}:8888
          insecure-skip-tls-verify: true
        name: minikube
      contexts:
      - context:
          cluster: minikube
          user: gitlab-ci
        name: minikube
      current-context: minikube
      kind: Config
      preferences: {}
      users:
      - name: gitlab-ci
        user: {}
      EOF

.monitoring_production_deploy: &monitoring_production_deploy
  <<: *monitoring_backend_deploy_base
  variables:
    ENVIRONMENT: production
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
  before_script:
    - !reference [.monitoring_backend_deploy_base, before_script]
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: ${K3S_SERVER}
          certificate-authority-data: ${K3S_CA_CERT}
        name: k3s-cluster
      contexts:
      - context:
          cluster: k3s-cluster
          user: k3s-user
        name: k3s-context
      current-context: k3s-context
      kind: Config
      preferences: {}
      users:
      - name: k3s-user
        user:
          client-certificate-data: ${K3S_CLIENT_CERT}
          client-key-data: ${K3S_CLIENT_KEY}
      EOF
    - kubectl config current-context
    - kubectl cluster-info

.monitoring_gke_deploy: &monitoring_gke_deploy
  <<: *monitoring_backend_deploy_base
  image: google/cloud-sdk:slim
  variables:
    ENVIRONMENT: gke
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/gke-config"
    USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
    CLOUDSDK_CORE_PROJECT: "$GCP_PROJECT_ID"
  before_script:
    - apt-get update && apt-get install -y curl kubectl google-cloud-cli-gke-gcloud-auth-plugin
    - echo "Installing Kustomize..."
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version
    - echo "Setting up GCP authentication..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file /tmp/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - export CLOUDSDK_CORE_PROJECT=$GCP_PROJECT_ID
    - gcloud services enable container.googleapis.com cloudresourcemanager.googleapis.com
    - gcloud container clusters get-credentials $GKE_CLUSTER_NAME --zone $GKE_ZONE
  after_script:
    - rm -f /tmp/gcp-key.json


checkout:
  <<: *job_definition
  stage: checkout
  before_script:
    - echo "Cleaning previous build artifacts..."
    - rm -rf target/
  script:
    - echo "Checking out code from ${CI_REPOSITORY_URL}"
  artifacts:
    paths:
      - ./

build:
  <<: *maven_definition
  stage: build
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/










docker_publish:
  <<: *job_definition
  stage: docker
  image: docker:24.0
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: 1
  before_script:
    - apk add --no-cache curl
    - echo "Using GitLab Container Registry $CI_REGISTRY_IMAGE"
    - echo "Commit SHA ${CI_COMMIT_SHORT_SHA}"

  script:
    - echo "=== BUILDING DOCKER IMAGE ==="
    - docker build -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" -t "$CI_REGISTRY_IMAGE:latest" .

    - echo "=== LOGGING INTO GITLAB CONTAINER REGISTRY ==="
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - echo "=== PUSHING IMAGES ==="
    - echo "Pushing versioned tag $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - echo "Pushing latest tag $CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    
    - echo "=== IMAGES PUSHED SUCCESSFULLY ==="
    - echo "Versioned , $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - echo "Latest,  $CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"



deploy_monitoring_backend_staging:
  <<: *monitoring_staging_deploy
  stage: deploy-staging
  script:
    - echo "=== DEPLOYING MONITORING BACKEND TO STAGING ==="
    - echo "Using commit SHA ${CI_COMMIT_SHORT_SHA}"
    - echo "Registry image ${CI_REGISTRY_IMAGE}"
    - echo "Full versioned image ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    - kubectl cluster-info
    
    # Create namespace
    - kubectl create namespace ${ENVIRONMENT} --dry-run=client -o yaml | kubectl apply -f -
    
    # Store the project root
    - PROJECT_ROOT=$(pwd)
    - echo "Project root $PROJECT_ROOT"
    
    # Navigate to staging overlay directory
    - cd $PROJECT_ROOT/k8s/overlays/staging
    - echo "Current directory $(pwd)"
    - ls -la
    
    # Clean up existing ConfigMap first
    - kubectl delete configmap monitoring-backend-config -n ${ENVIRONMENT} --ignore-not-found=true
    
    # Show current kustomization before changes
    - |
      echo "=== CURRENT KUSTOMIZATION BEFORE CHANGES ==="
      cat kustomization.yaml
    
    # Fix deprecated kustomize syntax automatically
    - |
      echo "=== FIXING KUSTOMIZE SYNTAX ==="
      kustomize edit fix || echo "No syntax issues to fix"
    
    # Update kustomization with the current commit SHA tag
    - |
      echo "=== UPDATING IMAGE TAG ==="
      echo "Setting image to: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      
      # First, check what images are currently in the kustomization
      echo "Current images in kustomization:"
      kustomize edit view | grep -A 10 "images:" || echo "No images found"
      
      # Use the correct image name from your kustomization.yaml
      # Based on your setup, it should be 'monitoring-backend'
      kustomize edit set image monitoring-backend=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
      
      echo "=== UPDATED KUSTOMIZATION ==="
      cat kustomization.yaml
      
      # Verify the image was set correctly
      echo "=== VERIFYING IMAGE UPDATE ==="
      kustomize edit view | grep -A 10 "images:"
    
    # Generate and validate manifests
    - |
      echo "=== GENERATING AND VALIDATING MANIFESTS ==="
      kustomize build . > $PROJECT_ROOT/monitoring-backend-staging-manifests.yaml
      
      # Show the actual image that will be deployed
      echo "=== IMAGE IN GENERATED MANIFESTS ==="
      grep -A 2 -B 2 "image:" $PROJECT_ROOT/monitoring-backend-staging-manifests.yaml
      
      # Verify the correct image is in the deployment
      DEPLOYED_IMAGE=$(grep -A 10 "kind Deployment" $PROJECT_ROOT/monitoring-backend-staging-manifests.yaml | grep "image:" | head -1 | awk '{print $2}')
      echo "Image that will be deployed $DEPLOYED_IMAGE"
      
      if [[ "$DEPLOYED_IMAGE" == *"${CI_COMMIT_SHORT_SHA}"* ]]; then
        echo "✅ Correct image with commit SHA found in manifests"
      else
        echo "❌ ERROR Generated manifests don't contain the correct image!"
        echo "Expected ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
        echo "Found $DEPLOYED_IMAGE"
        exit 1
      fi
    
    # Apply the manifests
    - |
      echo "=== APPLYING MANIFESTS ==="
      kubectl apply -k .
    
    # Wait a moment for the deployment to be updated
    - sleep 10
    
    # Force a rollout restart to ensure the new image is pulled
    - |
      echo "=== FORCING DEPLOYMENT RESTART ==="
      kubectl rollout restart deployment/monitoring-backend -n ${ENVIRONMENT}
    
    # Wait for the rollout to complete
    - |
      echo "=== WAITING FOR ROLLOUT ==="
      kubectl rollout status deployment/monitoring-backend -n ${ENVIRONMENT} --timeout=600s
    
    # Verify the deployment has the correct image
    - |
      echo "=== VERIFYING DEPLOYED IMAGE ==="
      ACTUAL_IMAGE=$(kubectl get deployment monitoring-backend -n ${ENVIRONMENT} -o jsonpath='{.spec.template.spec.containers[0].image}')
      echo "Actual deployed image: $ACTUAL_IMAGE"
      
      if [[ "$ACTUAL_IMAGE" == *"${CI_COMMIT_SHORT_SHA}"* ]]; then
        echo "✅ SUCCESS Deployment is using the correct commit-specific image!"
      else
        echo "❌ WARNING Deployment is not using the commit-specific image"
        echo "Expected ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
        echo "Actual  $ACTUAL_IMAGE"
        
        # Try to force update the deployment directly
        echo "=== ATTEMPTING DIRECT IMAGE UPDATE ==="
        kubectl patch deployment monitoring-backend -n ${ENVIRONMENT} -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"monitoring-backend\",\"image\":\"${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}\"}]}}}}"
        
        # Wait for the patch to take effect
        kubectl rollout status deployment/monitoring-backend -n ${ENVIRONMENT} --timeout=300s
        
        # Check again
        FINAL_IMAGE=$(kubectl get deployment monitoring-backend -n ${ENVIRONMENT} -o jsonpath='{.spec.template.spec.containers[0].image}')
        echo "Final deployed image  $FINAL_IMAGE"
      fi
    
    # Apply ingress if it exists
    - |
      echo "=== APPLYING INGRESS ==="
      if [ -f "$PROJECT_ROOT/k8s/ingress/staging-ingress.yaml" ]; then
        kubectl apply -f $PROJECT_ROOT/k8s/ingress/staging-ingress.yaml
      else
        echo "No staging ingress file found, skipping..."
      fi
    
    # Show final deployment status
    - |
      echo "=== FINAL DEPLOYMENT STATUS ==="
      kubectl get deployments,services,configmaps -n ${ENVIRONMENT}
      kubectl get pods -l app=monitoring-backend -n ${ENVIRONMENT}
      
      # Show the actual image being used
      echo "=== CURRENT IMAGE IN DEPLOYMENT ==="
      kubectl get deployment monitoring-backend -n ${ENVIRONMENT} -o jsonpath='{.spec.template.spec.containers[0].image}'
      echo ""
      
      # Show pod details to verify the image
      echo "=== POD IMAGE VERIFICATION ==="
      kubectl get pods -l app=monitoring-backend -n ${ENVIRONMENT} -o jsonpath='{.items[*].spec.containers[0].image}'
      echo ""
      
      # Show recent events
      echo "=== RECENT EVENTS ==="
      kubectl get events -n ${ENVIRONMENT} --sort-by='.lastTimestamp' | tail -10
  
  
  
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"