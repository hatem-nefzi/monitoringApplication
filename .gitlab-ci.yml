.job_template: &job_definition
  tags:
    - docker
  before_script:
    - echo "starting job in ${CI_JOB_NAME} stage"

.maven_job: &maven_definition
  <<: *job_definition
  image: hatemnefzi/maven-docker:latest
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - export MAVEN_HOME=/usr/share/maven
    - export PATH=$MAVEN_HOME/bin:$PATH

.kubectl_job: &kubectl_definition
  <<: *job_definition
  image: alpine/k8s:1.25.10
  variables:
    KUBECONFIG: /tmp/kubeconfig/config


# Template for production jobs (runs on VM2 - K3s)
.production_job: &production_job_definition
  tags:
    - production  # New runner tag
    - gitlab-runner-prod
    - kubernetes
    - minikube
    - registry
  variables:
    TARGET_ENV: "production"
    REGISTRY_URL: "$PRODUCTION_REGISTRY_URL"
    KUBE_SERVER: "https://$PRODUCTION_VM_IP:6443"  # K3s uses HTTPS and port 6443


# Common job definitions
.monitoring_backend_deploy_base: &monitoring_backend_deploy_base
  <<: *job_definition
  image: alpine/k8s:1.30.0
  variables:
    APP_NAME: "monitoring-backend"
    CONTAINER_PORT: 9090
    SERVICE_PORT: 80
    KUSTOMIZE_VERSION: "v5.4.3"
  before_script:
    - apk add --no-cache curl jq gettext
    - echo "Installing Kustomize..."
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version

.monitoring_staging_deploy: &monitoring_staging_deploy
  <<: *monitoring_backend_deploy_base
  variables:
    ENVIRONMENT: staging
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
    HOST_IP: "172.17.0.1"
    KUBECTL_VERSION: "v1.32.3"
  before_script:
    - !reference [.monitoring_backend_deploy_base, before_script]
    - curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: http://${HOST_IP}:8888
          insecure-skip-tls-verify: true
        name: minikube
      contexts:
      - context:
          cluster: minikube
          user: gitlab-ci
        name: minikube
      current-context: minikube
      kind: Config
      preferences: {}
      users:
      - name: gitlab-ci
        user: {}
      EOF

.monitoring_production_deploy: &monitoring_production_deploy
  <<: *monitoring_backend_deploy_base
  variables:
    ENVIRONMENT: production
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
  before_script:
    - !reference [.monitoring_backend_deploy_base, before_script]
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: ${K3S_SERVER}
          certificate-authority-data: ${K3S_CA_CERT}
        name: k3s-cluster
      contexts:
      - context:
          cluster: k3s-cluster
          user: k3s-user
        name: k3s-context
      current-context: k3s-context
      kind: Config
      preferences: {}
      users:
      - name: k3s-user
        user:
          client-certificate-data: ${K3S_CLIENT_CERT}
          client-key-data: ${K3S_CLIENT_KEY}
      EOF
    - kubectl config current-context
    - kubectl cluster-info

.monitoring_gke_deploy: &monitoring_gke_deploy
  <<: *monitoring_backend_deploy_base
  image: google/cloud-sdk:slim
  variables:
    ENVIRONMENT: gke
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/gke-config"
    USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
    CLOUDSDK_CORE_PROJECT: "$GCP_PROJECT_ID"
  before_script:
    - apt-get update && apt-get install -y curl kubectl google-cloud-cli-gke-gcloud-auth-plugin
    - echo "Installing Kustomize..."
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version
    - echo "Setting up GCP authentication..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file /tmp/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - export CLOUDSDK_CORE_PROJECT=$GCP_PROJECT_ID
    - gcloud services enable container.googleapis.com cloudresourcemanager.googleapis.com
    - gcloud container clusters get-credentials $GKE_CLUSTER_NAME --zone $GKE_ZONE
  after_script:
    - rm -f /tmp/gcp-key.json


checkout:
  <<: *job_definition
  stage: checkout
  before_script:
    - echo "Cleaning previous build artifacts..."
    - rm -rf target/
  script:
    - echo "Checking out code from ${CI_REPOSITORY_URL}"
  artifacts:
    paths:
      - ./

build:
  <<: *maven_definition
  stage: build
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/










docker_publish:
  <<: *job_definition
  stage: docker
  image: docker:24.0
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: 1
  before_script:
    - apk add --no-cache curl
    - echo "Using GitLab Container Registry $CI_REGISTRY_IMAGE"
    - echo "Commit SHA ${CI_COMMIT_SHORT_SHA}"

  script:
    - echo "=== BUILDING DOCKER IMAGE ==="
    - docker build -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" -t "$CI_REGISTRY_IMAGE:latest" .

    - echo "=== LOGGING INTO GITLAB CONTAINER REGISTRY ==="
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - echo "=== PUSHING IMAGES ==="
    - echo "Pushing versioned tag $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - echo "Pushing latest tag $CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    
    - echo "=== IMAGES PUSHED SUCCESSFULLY ==="
    - echo "Versioned , $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - echo "Latest,  $CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"



deploy_monitoring_backend_staging:
  <<: *monitoring_staging_deploy
  stage: deploy-staging
  variables:
    ENVIRONMENT: staging
    KUBE_SERVER: "http://your-kubernetes-api-server:port"  # Replace with actual server URL
  before_script:
    # Install kubectl properly
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
    - kubectl version --client
    # Install kustomize
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version
    # Configure kubectl properly
    - mkdir -p ~/.kube
    - |
      cat > ~/.kube/config <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: ${KUBE_SERVER}
          insecure-skip-tls-verify: true
        name: default-cluster
      contexts:
      - context:
          cluster: default-cluster
          user: default-user
        name: default-context
      current-context: default-context
      kind: Config
      preferences: {}
      users:
      - name: default-user
        user: {}
      EOF
    - kubectl cluster-info  # Verify connection
  script:
    - echo "=== DEPLOYING MONITORING BACKEND TO STAGING ==="
    - echo "Using commit SHA ${CI_COMMIT_SHORT_SHA}"
    - echo "GitLab Registry image ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
    
    # Create namespace if it doesn't exist (with validation disabled)
    - kubectl create namespace ${ENVIRONMENT} --dry-run=client -o yaml | kubectl apply -f - --validate=false
    
    # Navigate to staging overlay directory
    - cd k8s/overlays/staging
    
    # Clean up existing ConfigMap to ensure fresh config
    - kubectl delete configmap monitoring-backend-config -n ${ENVIRONMENT} --ignore-not-found=true
    
    # Update the image in kustomization
    - |
      echo "=== UPDATING IMAGE TAG ==="
      echo "Setting image to: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      
      # Set the image using GitLab Container Registry
      kustomize edit set image monitoring-backend=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
      
      # Add timestamp annotation to force rollout
      CURRENT_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      kustomize edit add annotation kubectl.kubernetes.io/restartedAt:"$CURRENT_TIMESTAMP" --path monitoring-backend
      
      echo "=== UPDATED KUSTOMIZATION ==="
      cat kustomization.yaml
    
    # Build and apply manifests
    - |
      echo "=== BUILDING AND APPLYING MANIFESTS ==="
      if ! kustomize build . | kubectl apply -f - --validate=false; then
        echo "❌ ERROR: Failed to apply manifests"
        kubectl get events -n ${ENVIRONMENT} --sort-by='.lastTimestamp' | tail -10
        exit 1
      fi
    
    # Force rollout if needed
    - kubectl rollout restart deployment/monitoring-backend -n ${ENVIRONMENT}
    
    # Wait for rollout to complete
    - |
      echo "=== WAITING FOR ROLLOUT ==="
      if ! kubectl rollout status deployment/monitoring-backend -n ${ENVIRONMENT} --timeout=300s; then
        echo "❌ ERROR: Rollout failed"
        kubectl describe deployment monitoring-backend -n ${ENVIRONMENT}
        kubectl get pods -l app=monitoring-backend -n ${ENVIRONMENT}
        exit 1
      fi
    
    # Verify deployment
    - |
      echo "=== VERIFYING DEPLOYMENT ==="
      DEPLOYED_IMAGE=$(kubectl get deployment monitoring-backend -n ${ENVIRONMENT} -o jsonpath='{.spec.template.spec.containers[0].image}')
      echo "Deployed image: $DEPLOYED_IMAGE"
      
      if [[ "$DEPLOYED_IMAGE" == *"${CI_COMMIT_SHORT_SHA}"* ]]; then
        echo "✅ SUCCESS: Deployment using correct image!"
        kubectl get pods -l app=monitoring-backend -n ${ENVIRONMENT}
      else
        echo "❌ ERROR: Wrong image deployed"
        echo "Expected: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
        echo "Actual: $DEPLOYED_IMAGE"
        exit 1
      fi
  
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"