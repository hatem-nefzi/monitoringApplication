  PRODUCTION_MONITORING_MEMORY_REQUEST: "384Mi"
  PRODUCTION_MONITORING_MEMORY_LIMIT: "768Mi"

  GKE_MONITORING_REPLICAS: "3"
  GKE_MONITORING_MEMORY_REQUEST: "512Mi"
  GKE_MONITORING_MEMORY_LIMIT: "1Gi"
  GKE_MONITORING_CPU_REQUEST: "400m"
  KE_MONITORING_CPU_LIMIT: "800m"
  

  





.job_template: &job_definition
  tags:
    - docker
  before_script:
    - echo "starting job in ${CI_JOB_NAME} stage"

.maven_job: &maven_definition
  <<: *job_definition
  image: hatemnefzi/maven-docker:latest
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - export MAVEN_HOME=/usr/share/maven
    - export PATH=$MAVEN_HOME/bin:$PATH

.kubectl_job: &kubectl_definition
  <<: *job_definition
  image: alpine/k8s:1.25.10
  variables:
    KUBECONFIG: /tmp/kubeconfig/config


# Template for production jobs (runs on VM2 - K3s)
.production_job: &production_job_definition
  tags:
    - production  # New runner tag
    - gitlab-runner-prod
    - kubernetes
    - minikube
    - registry
  variables:
    TARGET_ENV: "production"
    REGISTRY_URL: "$PRODUCTION_REGISTRY_URL"
    KUBE_SERVER: "https://$PRODUCTION_VM_IP:6443"  # K3s uses HTTPS and port 6443


# Common job definitions
.monitoring_backend_deploy_base: &monitoring_backend_deploy_base
  <<: *job_definition
  image: alpine/k8s:1.30.0
  variables:
    APP_NAME: "monitoring-backend"
    CONTAINER_PORT: 9090
    SERVICE_PORT: 80
    KUSTOMIZE_VERSION: "v5.4.3"
  before_script:
    - apk add --no-cache curl jq gettext
    - echo "Installing Kustomize..."
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version

.monitoring_staging_deploy: &monitoring_staging_deploy
  <<: *monitoring_backend_deploy_base
  variables:
    ENVIRONMENT: staging
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
    HOST_IP: "172.17.0.1"
    KUBECTL_VERSION: "v1.32.3"
  before_script:
    - !reference [.monitoring_backend_deploy_base, before_script]
    - curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: http://${HOST_IP}:8888
          insecure-skip-tls-verify: true
        name: minikube
      contexts:
      - context:
          cluster: minikube
          user: gitlab-ci
        name: minikube
      current-context: minikube
      kind: Config
      preferences: {}
      users:
      - name: gitlab-ci
        user: {}
      EOF

.monitoring_production_deploy: &monitoring_production_deploy
  <<: *monitoring_backend_deploy_base
  variables:
    ENVIRONMENT: production
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
  before_script:
    - !reference [.monitoring_backend_deploy_base, before_script]
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: ${K3S_SERVER}
          certificate-authority-data: ${K3S_CA_CERT}
        name: k3s-cluster
      contexts:
      - context:
          cluster: k3s-cluster
          user: k3s-user
        name: k3s-context
      current-context: k3s-context
      kind: Config
      preferences: {}
      users:
      - name: k3s-user
        user:
          client-certificate-data: ${K3S_CLIENT_CERT}
          client-key-data: ${K3S_CLIENT_KEY}
      EOF
    - kubectl config current-context
    - kubectl cluster-info

.monitoring_gke_deploy: &monitoring_gke_deploy
  <<: *monitoring_backend_deploy_base
  image: google/cloud-sdk:slim
  variables:
    ENVIRONMENT: gke
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/gke-config"
    USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
    CLOUDSDK_CORE_PROJECT: "$GCP_PROJECT_ID"
  before_script:
    - apt-get update && apt-get install -y curl kubectl google-cloud-cli-gke-gcloud-auth-plugin
    - echo "Installing Kustomize..."
    - curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
    - mv kustomize /usr/local/bin/
    - kustomize version
    - echo "Setting up GCP authentication..."
    - echo "$GCP_SERVICE_ACCOUNT_KEY" | base64 -d > /tmp/gcp-key.json
    - gcloud auth activate-service-account --key-file /tmp/gcp-key.json
    - gcloud config set project $GCP_PROJECT_ID
    - export CLOUDSDK_CORE_PROJECT=$GCP_PROJECT_ID
    - gcloud services enable container.googleapis.com cloudresourcemanager.googleapis.com
    - gcloud container clusters get-credentials $GKE_CLUSTER_NAME --zone $GKE_ZONE
  after_script:
    - rm -f /tmp/gcp-key.json


checkout:
  <<: *job_definition
  stage: checkout
  before_script:
    - echo "Cleaning previous build artifacts..."
    - rm -rf target/
  script:
    - echo "Checking out code from ${CI_REPOSITORY_URL}"
  artifacts:
    paths:
      - ./

build:
  <<: *maven_definition
  stage: build
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/










docker_publish:
  <<: *job_definition
  stage: docker
  image: docker:24.0
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: 1
  before_script:
    - apk add --no-cache curl
    - echo "Using GitLab Container Registry $CI_REGISTRY_IMAGE"
    - echo "Commit SHA ${CI_COMMIT_SHORT_SHA}"

  script:
    - echo "=== BUILDING DOCKER IMAGE ==="
    - docker build -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" -t "$CI_REGISTRY_IMAGE:latest" .

    - echo "=== LOGGING INTO GITLAB CONTAINER REGISTRY ==="
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - echo "=== PUSHING IMAGES ==="
    - echo "Pushing versioned tag $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - echo "Pushing latest tag $CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    
    - echo "=== IMAGES PUSHED SUCCESSFULLY ==="
    - echo "Versioned , $CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - echo "Latest,  $CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"



deploy_monitoring_backend_staging:
  <<: *monitoring_staging_deploy
  stage: deploy-staging
  script:
    - echo "=== DEPLOYING MONITORING BACKEND TO STAGING ==="
    - echo "Using commit SHA ${CI_COMMIT_SHORT_SHA}"
    - echo "Registry image ${CI_REGISTRY_IMAGE}"
    - kubectl cluster-info
    
    # Create namespace
    - kubectl create namespace ${ENVIRONMENT} --dry-run=client -o yaml | kubectl apply -f -
    
    # Create GitLab registry secret for staging namespace
    - |
      echo "Creating GitLab Container Registry secret for ${ENVIRONMENT}..."
      kubectl delete secret gitlab-registry-secret -n ${ENVIRONMENT} --ignore-not-found=true
      kubectl create secret docker-registry gitlab-registry-secret \
        --docker-server=${CI_REGISTRY} \
        --docker-username=${CI_REGISTRY_USER} \
        --docker-password=${CI_REGISTRY_PASSWORD} \
        -n ${ENVIRONMENT} \
        --dry-run=client -o yaml | kubectl apply -f -
    
    # Store the project root
    - PROJECT_ROOT=$(pwd)
    - echo "Project root $PROJECT_ROOT"
    # Apply RBAC resources first
    - |
      echo "=== APPLYING RBAC RESOURCES ==="
      kubectl apply -f $PROJECT_ROOT/k8s/base/rbac/service-account.yaml -n ${ENVIRONMENT}
      kubectl apply -f $PROJECT_ROOT/k8s/base/rbac/cluster-role.yaml -n ${ENVIRONMENT}
      kubectl apply -f $PROJECT_ROOT/k8s/base/rbac/cluster-role-binding.yaml -n ${ENVIRONMENT}
    
    # Navigate to staging overlay directory
    - cd $PROJECT_ROOT/k8s/overlays/staging
    - echo "Current directory $(pwd)"
    - ls -la
    
    # Clean up existing resources to avoid immutable field conflicts
    - kubectl delete configmap monitoring-backend-config -n ${ENVIRONMENT} --ignore-not-found=true
    - kubectl delete deployment monitoring-backend -n ${ENVIRONMENT} --ignore-not-found=true
    
    # Fix deprecated kustomize syntax automatically
    - |
      echo "=== FIXING KUSTOMIZE SYNTAX ==="
      kustomize edit fix || echo "No syntax issues to fix"
    
    # Update kustomization with the current commit SHA tag
    - |
      echo "=== UPDATING IMAGE TAG ==="
      echo "Setting image to: ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      
      # Use kustomize to set the image with the dynamic commit SHA
      kustomize edit set image monitoring-backend=${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
      
      echo "Updated kustomization.yaml:"
      cat kustomization.yaml
    
    # Validate the kustomization before applying
    - |
      echo "=== VALIDATING KUSTOMIZATION ==="
      kustomize build . > $PROJECT_ROOT/monitoring-backend-staging-manifests.yaml
      
      # Check for common issues in the generated manifests
      echo "=== CHECKING FOR MANIFEST ISSUES ==="
      
      # Check for valueFrom conflicts
      if grep -n "valueFrom:" $PROJECT_ROOT/monitoring-backend-staging-manifests.yaml; then
        echo "Found valueFrom entries - checking for conflicts..."
        # Show env section for debugging
        sed -n '/env:/,/resources:/p' $PROJECT_ROOT/monitoring-backend-staging-manifests.yaml
      fi
      
      # Show the image being used in the deployment
      echo "=== IMAGE IN DEPLOYMENT ==="
      grep -A 5 -B 5 "image:" $PROJECT_ROOT/monitoring-backend-staging-manifests.yaml || echo "No image found in manifests"
    
    # Apply the manifests using the generated file to ensure consistency
    - |
      echo "=== APPLYING MANIFESTS ==="
      kubectl apply -f $PROJECT_ROOT/monitoring-backend-staging-manifests.yaml
    
    # Wait a moment for the deployment to be created/updated
    - sleep 5
    
    # Check if deployment was created successfully
    - |
      echo "=== CHECKING DEPLOYMENT CREATION ==="
      # Wait for deployment to be created
      sleep 10
      
      if kubectl get deployment monitoring-backend -n ${ENVIRONMENT} >/dev/null 2>&1; then
        echo "Deployment created successfully, waiting for rollout..."
        kubectl rollout status deployment/monitoring-backend -n ${ENVIRONMENT} --timeout=600s
      else
        echo "❌ ERROR: Deployment was not created"
        exit 1
      fi
    
    # Apply ingress if it exists
    - |
      echo "=== APPLYING INGRESS ==="
      if [ -f "$PROJECT_ROOT/k8s/ingress/staging-ingress.yaml" ]; then
        kubectl apply -f $PROJECT_ROOT/k8s/ingress/staging-ingress.yaml
      else
        echo "No staging ingress file found, skipping..."
      fi
    
    # Show final deployment status and verify the image
    - |
      echo "=== DEPLOYMENT STATUS ==="
      kubectl get deployments,services,configmaps -n ${ENVIRONMENT}
      kubectl get pods -l app=monitoring-backend -n ${ENVIRONMENT} -o wide
      
      # Show the actual image being used in the deployment spec
      echo "=== CURRENT IMAGE IN DEPLOYMENT SPEC ==="
      DEPLOYMENT_IMAGE=$(kubectl get deployment monitoring-backend -n ${ENVIRONMENT} -o jsonpath='{.spec.template.spec.containers[0].image}')
      echo "Deployment spec image: $DEPLOYMENT_IMAGE"
      
      # Show the actual image being used in running pods
      echo "=== CURRENT IMAGE IN RUNNING PODS ==="
      kubectl get pods -l app=monitoring-backend -n ${ENVIRONMENT} -o jsonpath='{.items[*].spec.containers[0].image}' | tr ' ' '\n' | sort -u
      
      # Verify the image matches what we expect
      EXPECTED_IMAGE="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
      if [ "$DEPLOYMENT_IMAGE" = "$EXPECTED_IMAGE" ]; then
        echo "✅ SUCCESS: Deployment image matches expected image"
      else
        echo "❌ ERROR: Deployment image ($DEPLOYMENT_IMAGE) does not match expected image ($EXPECTED_IMAGE)"
        exit 1
      fi
      
      # Show environment variables for debugging
      echo "=== ENVIRONMENT VARIABLES ==="
      kubectl get deployment monitoring-backend -n ${ENVIRONMENT} -o jsonpath='{.spec.template.spec.containers[0].env}' | jq .
      
      # Show recent events
      echo "=== RECENT EVENTS ==="
      kubectl get events -n ${ENVIRONMENT} --sort-by='.lastTimestamp' | tail -10
      
      # Final health check
      echo "=== HEALTH CHECK ==="
      kubectl get pods -l app=monitoring-backend -n ${ENVIRONMENT} --no-headers | while read pod rest; do
        echo "Pod: $pod"
        kubectl get pod $pod -n ${ENVIRONMENT} -o jsonpath='{.status.phase}'
        echo ""
      done
  
  artifacts:
    paths:
      - monitoring-backend-staging-manifests.yaml
    expire_in: 1 week
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"

monitoring_staging_smoke_tests:
  <<: *kubectl_definition
  stage: staging-tests
  image: alpine:3.18
  variables:
    ENVIRONMENT: staging
    KUBECTL_VERSION: "v1.32.3"
    KUBECONFIG: "${CI_PROJECT_DIR}/.kube/config"
    HOST_IP: "172.17.0.1"
  before_script:
    - apk add --no-cache curl jq bash
    - curl -LO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
    - chmod +x kubectl && mv kubectl /usr/local/bin/
    - mkdir -p "$(dirname "$KUBECONFIG")"
    - |
      cat > "${KUBECONFIG}" <<EOF
      apiVersion: v1
      clusters:
      - cluster:
          server: http://${HOST_IP}:8888
          insecure-skip-tls-verify: true
        name: minikube
      contexts:
      - context:
          cluster: minikube
          user: gitlab-ci
        name: minikube
      current-context: minikube
      kind: Config
      preferences: {}
      users:
      - name: gitlab-ci
        user: {}
      EOF
  script:
    - echo "Running smoke tests against ${ENVIRONMENT} environment..."
    - kubectl port-forward service/monitoring-backend-service 9090:80 -n ${ENVIRONMENT} &
    - PORT_FORWARD_PID=$!
    - sleep 10

    - |
      echo "=== SMOKE TESTS ==="
      endpoints="/actuator/health /api/kubernetes/pods"
      for endpoint in $endpoints; do
        echo "Testing endpoint: $endpoint"
        if curl -sf http://localhost:9090$endpoint; then
          echo "✅ $endpoint is OK"
        else
          echo "❌ $endpoint FAILED"
          kill $PORT_FORWARD_PID
          exit 1
        fi
      done
    - kill $PORT_FORWARD_PID || true
  needs: ["deploy_monitoring_backend_staging"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "experiment"'
