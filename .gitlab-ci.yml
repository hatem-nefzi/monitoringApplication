  - checkout
  - build
  - test 
  - sonarqube
  - docker
  - security



variables:
  DOCKER_IMAGE: 'hatemnefzi/monitoring-backend:latest'
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_HOST: "unix:///var/run/docker.sock"
  REGISTRY_URL: "localhost:5000"
  # For kubernetes deployment - we are going to us the host IP instead of localhost
  MINIKUBE_HOST_IP: "192.168.58.1"
  K8S_REGISTRY_URL: "$MINIKUBE_HOST_IP:5000" # (172.17.0.1:5000)
  REGISTRY_IMAGE: "$REGISTRY_URL/proxiad-academie/monitoring-backend"
  K8S_REGISTRY_IMAGE: "$K8S_REGISTRY_URL/proxiad-academie/monitoring-backend" # this is the image ref for k8s 
  REGISTRY_USER: "ops"
  REGISTRY_PASSWORD: "ops2025"
  DOCKER_OPTS: "--config $CI_PROJECT_DIR/.docker"
   # adding dynamic traceable tags..
  COMMIT_TAG: "${CI_COMMIT_SHORT_SHA}"
  #VERSIONED_IMAGE: "$REGISTRY_IMAGE:${COMMIT_TAG}"
  KUBECONFIG: "$CI_PROJECT_DIR/.kube/config"
  HOST_IP: "172.17.0.1"  # Your Docker host IP. (172.17.0.1)
  #ensures sonarqube can access full git history
  GIT_DEPTH: 0
  # Environment-specific variables
  STAGING_NAMESPACE: "staging"
  PRODUCTION_NAMESPACE: "production"
  STAGING_REPLICAS: 1
  PRODUCTION_REPLICAS: 3
  STAGING_RESOURCES_MEMORY_REQUEST: "256Mi"
  STAGING_RESOURCES_MEMORY_LIMIT: "512Mi"
  PRODUCTION_RESOURCES_MEMORY_REQUEST: "512Mi"
  PRODUCTION_RESOURCES_MEMORY_LIMIT: "1Gi"
  #Fixed : use consistent namign and provide a valid hostname 
  STAGING_HOST: "myapp.staging.local"
  PRODUCTION_HOST: "myapp.production.local"
  #variables needed for multi-environment setup 
  STAGING_VM_IP: "192.168.100.155" #vm1 with minikube.
  PRODUCTION_VM_IP: "192.168.100.156" #vm2 with K3s
  STAGING_KUBE_SERVER: "http://${STAGING_VM_IP}:8888"
  PRODUCTION_KUBE_SERVER: "https://${PRODUCTION_VM_IP}:6443"
  # GitLab Container Registry variables
  GITLAB_REGISTRY_URL: "$CI_REGISTRY"
  GITLAB_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE"
  GITLAB_REGISTRY_USER: "$CI_REGISTRY_USER"
  GITLAB_REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  # New monitoring variables
  PROMETHEUS_STAGING_URL: "http://${STAGING_VM_IP}:30090"
  GRAFANA_STAGING_URL: "http://${STAGING_VM_IP}:30080"
  PROMETHEUS_PRODUCTION_URL: "http://prometheus.production.local"
  GRAFANA_PRODUCTION_URL: "http://grafana.production.local"
  GRAFANA_ADMIN_PASSWORD: "admin123"
  #GCP/GKE specific variables
  GCP_PROJECT_ID: "decent-vertex-459014-k2"
  GKE_CLUSTER_NAME: "my-pfe-cluster"
  GKE_ZONE: "europe-west1-b"
  GKE_NAMESPACE: "gke-production"
  GKE_REPLICAS: 2
  GKE_MEMORY_REQUEST: "256Mi"
  GKE_MEMORY_LIMIT: "512Mi"
  GKE_CPU_REQUEST: "100m"
  GKE_CPU_LIMIT: "200m"





.job_template: &job_definition
  tags:
    - docker
  before_script:
    - echo "starting job in ${CI_JOB_NAME} stage"

.maven_job: &maven_definition
  <<: *job_definition
  image: hatemnefzi/maven-docker:latest
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - export MAVEN_HOME=/usr/share/maven
    - export PATH=$MAVEN_HOME/bin:$PATH

.kubectl_job: &kubectl_definition
  <<: *job_definition
  image: alpine/k8s:1.25.10
  variables:
    KUBECONFIG: /tmp/kubeconfig/config




checkout:
  <<: *job_definition
  stage: checkout
  before_script:
    - echo "Cleaning previous build artifacts..."
    - rm -rf target/
  script:
    - echo "Checking out code from ${CI_REPOSITORY_URL}"
  artifacts:
    paths:
      - ./

build:
  <<: *maven_definition
  stage: build
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/









docker_publish:
  <<: *job_definition  # Keep your shared job template here
  stage: docker
  image: docker:24.0
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: 1
  before_script:
    - apk add --no-cache curl
    - echo "Using GitLab Container Registry->$CI_REGISTRY_IMAGE"

  script:
    - echo "Building Docker image with version tag and 'latest' tag..."
    - docker build -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" -t "$CI_REGISTRY_IMAGE:latest" .

    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - echo "Pushing versioned and latest tags..."
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"


