stages:
  - checkout
  - build
  - test 
  - security
  - sonarqube
  - docker
  - docker_security
  - deploy-staging
  - staging-tests
  - deploy-production
  - monitoring-verify
  - deploy-gke



variables:
  DOCKER_IMAGE: 'hatemnefzi/monitoring-backend:latest'
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_HOST: "unix:///var/run/docker.sock"
  REGISTRY_URL: "localhost:5000"
  # For kubernetes deployment - we are going to us the host IP instead of localhost
  MINIKUBE_HOST_IP: "192.168.58.1"
  K8S_REGISTRY_URL: "$MINIKUBE_HOST_IP:5000" # (172.17.0.1:5000)
  REGISTRY_IMAGE: "$REGISTRY_URL/proxiad-academie/monitoring-backend"
  K8S_REGISTRY_IMAGE: "$K8S_REGISTRY_URL/proxiad-academie/monitoring-backend" # this is the image ref for k8s 
  REGISTRY_USER: "ops"
  REGISTRY_PASSWORD: "ops2025"
  DOCKER_OPTS: "--config $CI_PROJECT_DIR/.docker"
   # adding dynamic traceable tags..
  COMMIT_TAG: "${CI_COMMIT_SHORT_SHA}"
  #VERSIONED_IMAGE: "$REGISTRY_IMAGE:${COMMIT_TAG}"
  KUBECONFIG: "$CI_PROJECT_DIR/.kube/config"
  HOST_IP: "172.17.0.1"  # Your Docker host IP. (172.17.0.1)
  #ensures sonarqube can access full git history
  GIT_DEPTH: 0
  # Environment-specific variables
  STAGING_NAMESPACE: "staging"
  PRODUCTION_NAMESPACE: "production"
  STAGING_REPLICAS: 1
  PRODUCTION_REPLICAS: 3
  STAGING_RESOURCES_MEMORY_REQUEST: "256Mi"
  STAGING_RESOURCES_MEMORY_LIMIT: "512Mi"
  PRODUCTION_RESOURCES_MEMORY_REQUEST: "512Mi"
  PRODUCTION_RESOURCES_MEMORY_LIMIT: "1Gi"
  #Fixed : use consistent namign and provide a valid hostname 
  STAGING_HOST: "myapp.staging.local"
  PRODUCTION_HOST: "myapp.production.local"
  #variables needed for multi-environment setup 
  STAGING_VM_IP: "192.168.100.155" #vm1 with minikube.
  PRODUCTION_VM_IP: "192.168.100.156" #vm2 with K3s
  STAGING_KUBE_SERVER: "http://${STAGING_VM_IP}:8888"
  PRODUCTION_KUBE_SERVER: "https://${PRODUCTION_VM_IP}:6443"
  # GitLab Container Registry variables
  GITLAB_REGISTRY_URL: "$CI_REGISTRY"
  GITLAB_REGISTRY_IMAGE: "$CI_REGISTRY_IMAGE"
  GITLAB_REGISTRY_USER: "$CI_REGISTRY_USER"
  GITLAB_REGISTRY_PASSWORD: "$CI_REGISTRY_PASSWORD"
  # New monitoring variables
  PROMETHEUS_STAGING_URL: "http://${STAGING_VM_IP}:30090"
  GRAFANA_STAGING_URL: "http://${STAGING_VM_IP}:30080"
  PROMETHEUS_PRODUCTION_URL: "http://prometheus.production.local"
  GRAFANA_PRODUCTION_URL: "http://grafana.production.local"
  GRAFANA_ADMIN_PASSWORD: "admin123"
  #GCP/GKE specific variables
  GCP_PROJECT_ID: "decent-vertex-459014-k2"
  GKE_CLUSTER_NAME: "my-pfe-cluster"
  GKE_ZONE: "europe-west1-b"
  GKE_NAMESPACE: "monitoring-backend"
  GKE_REPLICAS: 2
  GKE_MEMORY_REQUEST: "256Mi"
  GKE_MEMORY_LIMIT: "512Mi"
  GKE_CPU_REQUEST: "100m"
  GKE_CPU_LIMIT: "200m"

   # Application Configuration
  APP_NAME: "monitoring-backend"
  APP_PORT: "9090"





.job_template: &job_definition
  tags:
    - docker
  before_script:
    - echo "starting job in ${CI_JOB_NAME} stage"

.maven_job: &maven_definition
  <<: *job_definition
  image: hatemnefzi/maven-docker:latest
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - export MAVEN_HOME=/usr/share/maven
    - export PATH=$MAVEN_HOME/bin:$PATH

.kubectl_job: &kubectl_definition
  <<: *job_definition
  image: alpine/k8s:1.25.10
  variables:
    KUBECONFIG: /tmp/kubeconfig/config


# Template for production jobs (runs on VM2 - K3s)
.production_job: &production_job_definition
  tags:
    - production  # New runner tag
    - gitlab-runner-prod
    - kubernetes
    - minikube
    - registry
  variables:
    TARGET_ENV: "production"
    REGISTRY_URL: "$PRODUCTION_REGISTRY_URL"
    KUBE_SERVER: "https://$PRODUCTION_VM_IP:6443"  # K3s uses HTTPS and port 6443


checkout:
  <<: *job_definition
  stage: checkout
  before_script:
    - echo "Cleaning previous build artifacts..."
    - rm -rf target/
  script:
    - echo "Checking out code from ${CI_REPOSITORY_URL}"
  artifacts:
    paths:
      - ./

build:
  <<: *maven_definition
  stage: build
  cache:
    key: maven
    paths:
      - .m2/repository
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/

sonarqube_scan:
  <<: *maven_definition
  stage: sonarqube
  needs: ["build"]
  variables:
    SONAR_SCANNER_OPTS: "-Xmx1024m"
  script:
    - >
      mvn sonar:sonar
      -Dsonar.projectKey=monitoring-backend
      -Dsonar.projectName=monitoring-backend
      -Dsonar.host.url=${SONAR_HOST_URL}
      -Dsonar.token=${SONAR_TOKEN}
      -Dsonar.java.binaries=target/classes
      -Dsonar.sourceEncoding=UTF-8
      -Dsonar.sources=src/main/java
      -Dsonar.tests=src/test/java
      -Dsonar.junit.reportPaths=target/surefire-reports

owasp_dependency_check:
  <<: *maven_definition
  stage: security
  needs: ["build"]
  variables:
    FAIL_ON_CVSS: 9 # Only fail on critical vulnerabilities
  before_script:
    - mkdir -p .cache/dependency-check
    - if [ -f package.json ]; then npm install --package-lock-only; fi
  script:
    - |
      mvn org.owasp:dependency-check-maven:check \
        -Dformat=ALL \
        -DoutputDirectory=./reports/dependency-check \
        -DsuppressionFile=.gitlab/dependency-check-suppressions.xml \
        -DdataDirectory=.cache/dependency-check \
        -DfailBuildOnCVSS=${FAIL_ON_CVSS}
    - ls -la target/ | grep dependency-check
  artifacts:
    paths:
      - target/dependency-check-report.*
    reports:
      dependency_scanning: target/dependency-check-report.json
    expire_in: 1 week
  cache:
    key: "dependency-check-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/dependency-check/
    policy: pull-push
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"









docker_publish:
  <<: *job_definition  # Keep your shared job template here
  stage: docker
  image: docker:24.0
  variables:
    DOCKER_HOST: "unix:///var/run/docker.sock"
    DOCKER_BUILDKIT: 1
  before_script:
    - apk add --no-cache curl
    - echo "Using GitLab Container Registry->$CI_REGISTRY_IMAGE"

  script:
    - echo "Building Docker image with version tag and 'latest' tag..."
    - docker build -t "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}" -t "$CI_REGISTRY_IMAGE:latest" .

    - echo "Logging into GitLab Container Registry..."
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin

    - echo "Pushing versioned and latest tags..."
    - docker push "$CI_REGISTRY_IMAGE:${CI_COMMIT_SHORT_SHA}"
    - docker push "$CI_REGISTRY_IMAGE:latest"
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"


container_scan:
  <<: *job_definition
  stage: docker_security
  image: 
    name: aquasec/trivy:latest
    entrypoint: [""]
  needs: ["docker_publish"]
  script:
    - echo "Scanning image $VERSIONED_IMAGE"
    - trivy image --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --insecure --output gl-container-scanning-report.json "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" # change exit code to 1 for production to failt the ci when we find high risk vulnerability
  artifacts:
    reports:
      container_scanning: gl-container-scanning-report.json
    when: always
  rules:
    - if: $CI_COMMIT_BRANCH == "experiment"








